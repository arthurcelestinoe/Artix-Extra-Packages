# Where to look for new versions. The section must have the directory's name.
# Reference: https://nvchecker.readthedocs.io/en/latest/usage.html
# Use only ONE of the options below.

[example]
# GitHub: highest tag (or use_latest_release = true for Releases).
source = "github"
github = "OWNER/example"
use_max_tag = true
prefix = "v"

# Any git repository (Codeberg, sourcehut, cgit, self-hosted):
# source = "git"
# git = "https://codeberg.org/OWNER/example.git"
# prefix = "v"

# GitLab (self-hosted instances too):
# source = "gitlab"
# gitlab = "OWNER/example"
# host = "gitlab.freedesktop.org"
# use_max_tag = true

# Skip tags that aren't versions and turn "1-2-3" into "1.2.3":
# include_regex = "v[0-9.-]+"
# from_pattern = "-"
# to_pattern = "."
