name: Testar pull request

# Compila os pacotes alterados num PR e confere as regras do README.
# Não publica nada. Em PRs de fork, o GitHub roda este workflow sem acesso aos
# secrets e com token só de leitura. Nunca troque por pull_request_target.

on:
  pull_request:
    paths: ['packages/**']

env:
  REPO_NAME: artix-extra-unofficial
  REPO_URL: https://github.com/${{ github.repository }}/releases/download/repo

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: list
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          json=$(scripts/changed-packages.sh --diff "$BASE" HEAD)
          echo "packages=$json" >> "$GITHUB_OUTPUT"
          echo "a testar: $json"

  build:
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    container: artixlinux/artixlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.packages) }}
    steps:
      - name: Atualizar o sistema
        run: |
          pacman-key --init
          pacman-key --populate artix
          pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: scripts/ci-setup.sh
      - name: Compilar
        env:
          PKG: ${{ matrix.package }}
        run: scripts/build-package.sh "$PKG" out
      - name: Conferir regras
        env:
          PKG: ${{ matrix.package }}
        run: scripts/lint-package.sh "$PKG" out
