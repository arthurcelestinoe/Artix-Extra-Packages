name: Test pull request

# Builds the packages changed in a PR and checks the README rules.
# Publishes nothing. For PRs from forks, GitHub runs this workflow without access
# to secrets and with a read-only token. Never switch to pull_request_target.

on:
  pull_request:
    paths: ['packages/**']

env:
  REPO_NAME: artix-extra-unofficial
  REPO_URL: https://github.com/${{ github.repository }}/releases/download/repo

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: list
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          json=$(scripts/changed-packages.sh --diff "$BASE" HEAD)
          echo "packages=$json" >> "$GITHUB_OUTPUT"
          echo "to test: $json"

  build:
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    container: artixlinux/artixlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.packages) }}
    steps:
      - name: Update the system
        run: |
          pacman-key --init
          pacman-key --populate artix
          pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: scripts/ci-setup.sh
      - name: Build
        env:
          PKG: ${{ matrix.package }}
        run: scripts/build-package.sh "$PKG" out
      - name: Check rules
        env:
          PKG: ${{ matrix.package }}
        run: scripts/lint-package.sh "$PKG" out
